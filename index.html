<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>價值觀天秤：平衡優化版</title>
    <style>
        :root { --brick-color: #546e7a; --pan-label: #263238; }
        body { font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; background: #f5f7f9; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
        
        /* 標題與重置按鈕區 - 增加內縮間距 */
        .header-bar { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 25px; width: 90%; position: relative; z-index: 30; }
        h1 { color: var(--pan-label); font-size: 1.5rem; margin: 0; }
        .reset-btn { padding: 6px 16px; background: #455a64; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: background 0.2s; }
        .reset-btn:hover { background: #263238; }

        /* 數值訊息 */
        #msg { font-size: 1.2rem; margin: 15px; color: #546e7a; font-weight: bold; z-index: 30; }

        /* 側邊標籤：執行內縮指令，調整為 left/right: 12% */
        .side-label { position: fixed; top: 130px; padding: 10px 22px; background: white; border: 2px solid #cfd8dc; border-radius: 12px; font-size: 1.4rem; font-weight: bold; color: var(--pan-label); box-shadow: 0 4px 10px rgba(0,0,0,0.08); z-index: 20; }
        .label-left { left: 12%; }
        .label-right { right: 12%; }

        /* 天秤主舞台 */
        .stage { position: relative; width: 100%; max-width: 800px; height: 420px; margin-top: 10px; }
        
        /* 支柱與底座 */
        .pillar { position: absolute; bottom: 80px; left: 50%; width: 22px; height: 320px; background: #90a4ae; transform: translateX(-50%); border-radius: 11px; z-index: 1; }
        .base { position: absolute; bottom: 60px; left: 50%; width: 220px; height: 20px; background: #78909c; transform: translateX(-50%); border-radius: 4px; }
        
        /* 橫樑 */
        .beam-group { position: absolute; top: 40px; width: 100%; transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1); transform-origin: center 12px; z-index: 5; }
        .beam { width: 85%; height: 16px; background: #b0bec5; margin: 0 auto; border-radius: 8px; }
        
        /* 秤盤 */
        .pans { display: flex; justify-content: space-between; padding: 0 8%; margin-top: -5px; }
        .pan { width: 170px; min-height: 190px; border: 5px solid #b0bec5; border-top: none; border-radius: 0 0 20px 20px; background: rgba(255,255,255,0.7); display: flex; flex-wrap: wrap-reverse; align-content: flex-start; justify-content: center; padding: 12px; gap: 5px; }

        /* 積木 */
        .brick { width: 34px; height: 20px; position: relative; background: var(--brick-color); cursor: pointer; touch-action: none; border-radius: 2px; border: 1px solid rgba(0,0,0,0.1); }
        .brick::before { content: ""; position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 15px; height: 5px; background: var(--brick-color); border-radius: 1px 1px 0 0; }

        /* 倉庫區域 */
        .inventory-area { width: 100%; position: fixed; bottom: 0; background: #eceff1; padding: 20px 0 45px; display: flex; flex-direction: column; align-items: center; border-radius: 30px 30px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.05); z-index: 40; }
        .brick-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; padding: 15px; background: #fff; border-radius: 12px; border: 2px dashed #b0bec5; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>⚖️ 價值觀天秤</h1>
        <button class="reset-btn" onclick="location.reload()">🔄 重置天秤</button>
    </div>
    
    <div id="msg">誠實 (0) : 友誼 (0)</div>

    <div class="side-label label-left">❤️ 誠實</div>
    <div class="side-label label-right">🤝 友誼</div>

    <div class="stage">
        <div id="moving-part" class="beam-group">
            <div class="beam"></div>
            <div class="pans">
                <div id="left-pan" class="pan" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
                <div id="right-pan" class="pan" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>
        </div>
        <div class="pillar"></div>
        <div class="base"></div>
    </div>

    <div class="inventory-area">
        <div id="main-inv" class="brick-grid" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
    </div>

    <script>
        const inv = document.getElementById('main-inv');
        for(let i=0; i<20; i++) {
            inv.innerHTML += `<div class="brick" draggable="true" ondragstart="drag(event)" id="b${i}"></div>`;
        }

        function allowDrop(e) { e.preventDefault(); }
        function drag(e) { e.dataTransfer.setData("text", e.target.id); }
        
        function drop(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData("text");
            const el = document.getElementById(id);
            
            let target = e.target;
            while (target && !target.classList.contains('pan') && !target.classList.contains('brick-grid')) {
                target = target.parentElement;
            }

            if (target) {
                target.appendChild(el);
                update();
            }
        }

        function update() {
            const L = document.querySelectorAll('#left-pan .brick').length;
            const R = document.querySelectorAll('#right-pan .brick').length;
            const angle = (R - L) * 0.8; 
            document.getElementById('moving-part').style.transform = `rotate(${angle}deg)`;
            document.getElementById('msg').innerHTML = `誠實 (${L}) : 友誼 (${R})`;
        }
    </script>
</body>
</html>
