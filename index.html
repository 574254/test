<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 設定禁止使用者縮放畫面，讓拖曳體驗更像原生 App -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>先後喊互動小遊戲</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 引入 Babel (用來在瀏覽器中編譯 JSX 語法) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 防止手機端長按選取文字、跳出右鍵選單，或下拉重新整理 */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden; 
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 替換原本的 Lucide 圖示，改用內建 SVG 元件以確保無需編譯即可顯示 ---
        const Trash2 = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );
        const Sparkles = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path>
            </svg>
        );
        const Lightbulb = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path>
            </svg>
        );
        const RotateCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path>
            </svg>
        );

        // --- 遊戲主程式 ---
        function App() {
            const [balls, setBalls] = useState([]);
            const [dragInfo, setDragInfo] = useState(null); 
            const [hoverZone, setHoverZone] = useState(null); 
            const boxRef = useRef(null);

            const handlePointerDown = (e, info) => {
                if (e.cancelable) e.preventDefault();
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                setDragInfo({ ...info, x: clientX, y: clientY });
            };

            useEffect(() => {
                if (!dragInfo) {
                    setHoverZone(null);
                    return;
                }

                const handleMove = (e) => {
                    if (e.cancelable) e.preventDefault();
                    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

                    setDragInfo(prev => ({ ...prev, x: clientX, y: clientY }));

                    const target = document.elementFromPoint(clientX, clientY);
                    if (target?.closest('[data-zone="trash"]')) {
                        setHoverZone('trash');
                    } else if (target?.closest('[data-zone="box"]')) {
                        setHoverZone('box');
                    } else {
                        setHoverZone(null);
                    }
                };

                const handleUp = (e) => {
                    const clientX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
                    const clientY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;

                    const target = document.elementFromPoint(clientX, clientY);
                    const isTrash = target?.closest('[data-zone="trash"]');
                    const isBox = target?.closest('[data-zone="box"]');

                    if (isTrash) {
                        if (dragInfo.type === 'placed') {
                            setBalls(prev => prev.filter(b => b.id !== dragInfo.id));
                        }
                    } else if (isBox && boxRef.current) {
                        const boxRect = boxRef.current.getBoundingClientRect();
                        const ballRadius = 24; 
                        let relX = clientX - boxRect.left;
                        let relY = clientY - boxRect.top;
                        
                        relX = Math.max(ballRadius, Math.min(boxRect.width - ballRadius, relX));
                        relY = Math.max(ballRadius, Math.min(boxRect.height - ballRadius, relY));

                        if (dragInfo.type === 'source') {
                            setBalls(prev => [...prev, {
                                id: Date.now().toString() + Math.random().toString(),
                                color: dragInfo.color,
                                x: relX,
                                y: relY
                            }]);
                        } else if (dragInfo.type === 'placed') {
                            setBalls(prev => prev.map(b => b.id === dragInfo.id ? { ...b, x: relX, y: relY } : b));
                        }
                    }
                    
                    setDragInfo(null);
                    setHoverZone(null);
                };

                window.addEventListener('mousemove', handleMove, { passive: false });
                window.addEventListener('mouseup', handleUp);
                window.addEventListener('touchmove', handleMove, { passive: false });
                window.addEventListener('touchend', handleUp);

                return () => {
                    window.removeEventListener('mousemove', handleMove);
                    window.removeEventListener('mouseup', handleUp);
                    window.removeEventListener('touchmove', handleMove);
                    window.removeEventListener('touchend', handleUp);
                };
            }, [dragInfo]);

            const handleClearAll = () => setBalls([]);

            const Ball = ({ color, className = "", onDown, isSource = false }) => (
                <div 
                    onMouseDown={onDown}
                    onTouchStart={onDown}
                    className={`w-12 h-12 sm:w-14 sm:h-14 rounded-full cursor-grab active:cursor-grabbing touch-none select-none relative ${className}`}
                >
                    <div 
                        className="absolute inset-0 rounded-full shadow-[0_8px_16px_rgba(0,0,0,0.3)] transition-transform"
                        style={{
                            background: color === 'black' 
                                ? 'radial-gradient(circle at 35% 25%, #64748b 0%, #1e293b 40%, #020617 100%)' 
                                : 'radial-gradient(circle at 35% 25%, #fca5a5 0%, #ef4444 40%, #7f1d1d 100%)',
                            boxShadow: isSource 
                                ? (color === 'black' ? '0 0 20px rgba(30,41,59,0.4)' : '0 0 20px rgba(239,68,68,0.4)') 
                                : '0 8px 16px rgba(0,0,0,0.3)'
                        }}
                    >
                        <div className="absolute top-[10%] left-[15%] w-1/3 h-1/3 bg-white/30 rounded-full blur-[2px] transform -rotate-45"></div>
                    </div>
                </div>
            );

            return (
                <div className="relative w-full h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 flex flex-col overflow-hidden font-sans select-none">
                    
                    <div className="absolute top-[-10%] left-[-5%] w-96 h-96 bg-purple-200/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-pulse"></div>
                    <div className="absolute bottom-[-10%] right-[-5%] w-96 h-96 bg-pink-200/40 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-pulse" style={{animationDelay: '2s'}}></div>

                    <div className="flex justify-between items-start w-full p-4 sm:p-6 z-20">
                        <div className="flex flex-col gap-2">
                            <div className="flex items-center text-indigo-800 bg-white/80 backdrop-blur-md px-4 py-3 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.08)] border border-white/60">
                                <div className="w-6 h-6 mr-3 text-amber-500"><Lightbulb /></div>
                                <span className="text-base sm:text-lg font-bold tracking-wide">使用假設的技巧，決定先喊幾顆後喊幾顆</span>
                            </div>
                            <div className="flex items-center text-slate-500 pl-2">
                                <div className="w-4 h-4 mr-1.5 text-indigo-400"><Sparkles /></div>
                                <span className="text-xs sm:text-sm font-medium">拖曳圓球排列順序，丟進垃圾桶可清除單顆</span>
                            </div>
                        </div>

                        <div className="flex items-stretch gap-2 sm:gap-3 shrink-0 ml-2 sm:ml-4">
                            <button 
                                onClick={handleClearAll}
                                className="flex items-center justify-center gap-2 px-3 sm:px-5 rounded-2xl shadow-lg transition-all duration-200 ease-out backdrop-blur-sm border-2 bg-white/80 border-white text-slate-500 hover:border-indigo-200 hover:text-indigo-600 hover:bg-indigo-50/80 active:scale-95"
                                title="全部清除"
                            >
                                <div className="w-6 h-6 sm:w-7 sm:h-7"><RotateCcw /></div>
                                <span className="font-bold hidden md:block text-sm sm:text-base">全部清除</span>
                            </button>

                            <div 
                                data-zone="trash"
                                className={`flex items-center justify-center p-3 sm:p-4 rounded-2xl shadow-lg transition-all duration-300 ease-out backdrop-blur-sm border-2 ${hoverZone === 'trash' ? 'bg-rose-100/90 border-rose-400 scale-110 text-rose-600 shadow-[0_0_30px_rgba(244,63,94,0.3)]' : 'bg-white/80 border-white text-slate-400 hover:border-rose-200 hover:text-rose-400 hover:bg-rose-50/80'}`}
                                title="拖曳到此處刪除單顆球"
                            >
                                <div className="w-6 h-6 sm:w-8 sm:h-8"><Trash2 /></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col items-center px-4 sm:px-8 pb-8 w-full max-w-5xl mx-auto h-full z-10 gap-6">
                        
                        <div 
                            ref={boxRef}
                            data-zone="box"
                            className={`relative w-full flex-1 max-h-[400px] sm:max-h-[500px] mt-4 rounded-3xl transition-all duration-300 overflow-hidden backdrop-blur-md border-2 ${hoverZone === 'box' ? 'border-indigo-400 bg-indigo-50/40 shadow-[0_0_40px_rgba(99,102,241,0.2)_inset]' : 'border-white/60 bg-white/40 shadow-[0_8px_32px_rgba(31,38,135,0.07)] hover:bg-white/50'}`}
                        >
                            <div className="absolute inset-0 opacity-[0.03] pointer-events-none" style={{ backgroundImage: 'radial-gradient(#000 1px, transparent 1px)', backgroundSize: '20px 20px' }}></div>

                            {balls.length === 0 && !dragInfo && (
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <span className="text-indigo-900/30 font-bold text-xl sm:text-2xl tracking-widest pointer-events-none drop-shadow-sm">將球拖曳至此排列</span>
                                </div>
                            )}

                            {balls.map((ball) => (
                                <div
                                    key={ball.id}
                                    className="absolute transform -translate-x-1/2 -translate-y-1/2 touch-none z-10"
                                    style={{ left: ball.x, top: ball.y }}
                                >
                                    <Ball 
                                        color={ball.color} 
                                        className={dragInfo?.id === ball.id ? 'opacity-40 scale-90' : 'opacity-100 transition-transform hover:scale-110 duration-200'}
                                        onDown={(e) => handlePointerDown(e, { type: 'placed', id: ball.id, color: ball.color })}
                                    />
                                </div>
                            ))}
                        </div>

                        <div className="flex flex-row items-center justify-center gap-12 sm:gap-24 mt-auto mb-4 bg-white/40 backdrop-blur-md px-8 py-6 rounded-3xl border border-white/50 shadow-sm w-full sm:w-auto relative">
                            
                            <div className="flex flex-col items-center justify-center group">
                                <div className="relative mb-4">
                                    <div className="absolute inset-[-15px] bg-slate-400/20 rounded-full blur-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                    <Ball color="black" isSource={true} onDown={(e) => handlePointerDown(e, { type: 'source', color: 'black' })} />
                                </div>
                                <div className="text-slate-700 font-extrabold text-lg tracking-widest bg-white/80 px-6 py-1.5 rounded-full shadow-sm border border-slate-100">先喊</div>
                            </div>

                            <div className="w-px h-16 bg-slate-300/50 hidden sm:block"></div>

                            <div className="flex flex-col items-center justify-center group">
                                <div className="relative mb-4">
                                    <div className="absolute inset-[-15px] bg-red-400/20 rounded-full blur-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                    <Ball color="red" isSource={true} onDown={(e) => handlePointerDown(e, { type: 'source', color: 'red' })} />
                                </div>
                                <div className="text-rose-700 font-extrabold text-lg tracking-widest bg-white/80 px-6 py-1.5 rounded-full shadow-sm border border-rose-100">後喊</div>
                            </div>

                        </div>
                    </div>

                    {dragInfo && (
                        <div 
                            className="fixed pointer-events-none z-50 transform -translate-x-1/2 -translate-y-1/2 opacity-95 scale-110 drop-shadow-2xl"
                            style={{ left: dragInfo.x, top: dragInfo.y }}
                        >
                            <Ball color={dragInfo.color} />
                        </div>
                    )}
                </div>
            );
        }

        // --- 將 React 元件渲染到畫面上 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```
